<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- سكريبت صغير بيحدد الثيم قبل ما الصفحة تتعرض، عشان منمنعش "فلاش" لون غلط -->
<script>
  (function(){
    try{
      var t = localStorage.getItem('theme') || 'auto';
      if(t !== 'auto'){ document.documentElement.setAttribute('data-theme', t); }
    }catch(e){}
  })();
</script>
<title>ioseph — Blog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- =====================================================================
     ازاي تضيف بوست جديد (خطوتين بس):

     1) روح لمجلد "posts" وانسخ أي ملف .md موجود (زي hello-world.md)،
        وسمّي النسخة الجديدة اسم مناسب بالإنجليزي زي: my-new-post.md
        افتحه بأي محرر نصوص وعدّل العنوان والتاريخ والوصف اللي فوق
        بين الـ ---  و---  ، وتحت اكتب البوست بصيغة Markdown عادي
        (# عنوان، **بولد**، *مائل*، وهكذا).

     2) افتح ملف posts/manifest.js وضيف اسم الملف اللي عملته في
        القايمة (سطر واحد بس). البوستات بترتب تلقائي حسب التاريخ.

     كده بس، مفيش حاجة تانية محتاجة تتعمل ولا أي سيرفر أو داتا بيز.

     ملحوظة: عشان الصفحة دي بتجيب البوستات بالجافاسكريبت، لازم تفتح
     الموقع عن طريق سيرفر محلي بسيط أو استضافة (مش بفتح الملف على
     طول من جهازك) — التفاصيل في ملف اقرأني-كيف-تعدل.txt
===================================================================== -->

<header class="site-header">
  <nav class="site-nav">
    <!-- زرار تبديل الثيم: تلقائي (زي إعدادات الجهاز) ← أبيض ← أسود ← تلقائي ... -->
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
      <svg class="icon icon-auto" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor"/></svg>
      <svg class="icon icon-light" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="4.4"/><line x1="12" y1="19.6" x2="12" y2="22"/><line x1="2" y1="12" x2="4.4" y2="12"/><line x1="19.6" y1="12" x2="22" y2="12"/><line x1="4.6" y1="4.6" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.4" y2="19.4"/><line x1="4.6" y1="19.4" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.4" y2="4.6"/></g></svg>
      <svg class="icon icon-dark" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M19.8 14.5A8.4 8.4 0 1 1 9.6 4.3a6.9 6.9 0 0 0 10.2 10.2z" fill="currentColor"/></svg>
    </button>
    <a href="index.html" class="brand">ioseph</a>
    <a href="blog.html" class="active">Blog</a>
    <a href="projects.html">Projects</a>
    <a href="mods.html">My Mods</a>
    <a href="cv.html">CV</a>
    <div class="nav-search" id="nav-search">
      <button type="button" class="nav-search-btn" id="nav-search-btn" aria-label="Search" title="Search">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <input type="text" id="nav-search-input" class="nav-search-input" placeholder="Search blog…" aria-label="Search blog">
    </div>
  </nav>
</header>

<main>
  <div class="wrap">
    <span class="eyebrow">Blog</span>
    <h1>Writing</h1>
    <p class="lead">Notes, updates, and things I'm learning.</p>

    <!-- شريط التصنيفات (Flairs) — بيتعرض تلقائي حسب التاجات المستخدمة في البوستات -->
    <div class="flair-bar" id="flair-bar"></div>

    <!-- مربع البحث — بيدور في العنوان والوصف وانت بتكتب -->
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="search-input" placeholder="Search posts…" aria-label="Search posts">
    </div>

    <hr class="rule">

    <!-- ===================== قائمة البوستات — بتتعمل تلقائي بالجافاسكريبت ===================== -->
    <div class="card-list" id="post-list">
      <p style="color:var(--ink-soft);">Loading…</p>
    </div>

    <!-- أرقام الصفحات (5 بوستات في كل صفحة) -->
    <div class="pagination" id="pagination"></div>
    <!-- ==================================================================== -->

  </div>
</main>

<footer>
  <div class="wrap">
    © <span id="year"></span> ioseph. Discord : ioseph.exe . Last updated: August 8, 2026.
  <!--  ioseph. Built with plain HTML. -->-->
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="posts/manifest.js"></script>
<script src="blog.js"></script>
<script src="nav-search.js"></script>
<script src="theme.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  initBlogPage();
</script>

</body>
</html>
